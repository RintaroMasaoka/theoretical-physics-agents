# Project Configuration
#
# Edit this file, then run `node .scripts/generate-runtime.mjs` to apply.
# Templates are in .templates/; generated files are emitted into target runtime directories under the repository root.
# Do not edit generated target config mirrors directly — they will be overwritten.

# Response language for all user-facing output
language: japanese

# Programming language for simulation code
simulation:
  language: julia
  visualization: cairomakie

# Default cycle counts (overridden by /auto N or /write N)
cycles:
  auto: 5
  write: 5
